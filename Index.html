<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>MY LIFE</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json"><style>html,body{margin:0;height:100%;background:#0b0d12}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="f" src="app.html"></iframe><script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
const f=document.getElementById('f');f.onload=()=>{try{const w=f.contentWindow,N=w.Notification;w.Notification=function(t,o){navigator.serviceWorker.ready.then(r=>r.showNotification(t,o))};w.Notification.requestPermission=N.requestPermission.bind(N);Object.defineProperty(w.Notification,'permission',{get:()=>N.permission})}catch(e){}};
</script></body></html>
