<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>MY LIFE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b0d12;--card:#151922;--bd:#232a38;--tx:#f2f5fa;--mu:#8a94a8;--ac:#3b82f6;--ok:#22c55e;--no:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--bg:#f3f5f9;--card:#fff;--bd:#dde2ec;--tx:#0b0d12;--mu:#5b6579}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:760px;margin:auto;padding:16px 14px 100px;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:18px 0 8px}h3{margin:0 0 10px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
button,input,select,textarea{font:inherit;color:var(--tx)}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:3px 0 8px}
button{cursor:pointer}.b,.b2{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;flex:1}.b2{background:var(--bd);color:var(--tx)}
.s{padding:4px 9px;border-radius:8px;border:1px solid var(--bd);background:none;font-size:13px}.s.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--ac);transition:width .5s}
.big{font-size:21px;font-weight:700}.ok{color:var(--ok)}.no{color:var(--no)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mu);font-size:11px}nav button.on{color:var(--ac)}nav b{display:block;font-size:19px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:28px;z-index:6;box-shadow:0 6px 20px #3b82f666}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:flex-end;justify-content:center}#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{font-size:13px;color:var(--mu)}.dy{display:inline-block;margin-right:8px}.dy input{width:auto;margin:0 3px 0 0}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:9px 16px;border-radius:20px;z-index:20;display:none;max-width:90%}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.cols span{display:inline-block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--ac);background:none;flex:none;color:#fff;font-size:13px;padding:0}.ck.d{background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 0;font-size:13px}.cal button.t{border-color:var(--ac)}
.av{width:64px;height:64px;border-radius:50%;background:var(--bd) center/cover;flex:none}
</style></head><body><div id="app"></div><button class="fab" id="fab" onclick="quick()">+</button><nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TD=()=>iso(new Date());
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],PR=['Baixa','Média','Alta'],TERM=['Curto prazo','Médio prazo','Longo prazo'];
const GC=['Desenvolvimento físico','Aparência pessoal','Estudos','Carreira','Dinheiro','Fé e espiritualidade','Desenvolvimento pessoal'];
const EC=['Alimentação','Transporte','Moradia','Lazer','Estudos','Saúde','Outros'],IC=['Salário','Extra','Presente','Outros'];
const D={name:'',photo:'',theme:'dark',tasks:[],goals:[],tx:[],sav:[],rem:[],fav:[],xp:0,log:{},cats:['Estudos','Academia','Futebol','Trabalho','Desenvolvimento pessoal','Espiritualidade','Família','Lazer']};
let S,tab='home',sub='',cm='day',cd=TD(),fired={};
try{S=JSON.parse(localStorage.getItem('mylife')||'null')}catch(e){S=null}S=Object.assign(structuredClone(D),S||{});
function save(){try{localStorage.setItem('mylife',JSON.stringify(S))}catch(e){toast('Erro ao salvar: armazenamento indisponível')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function closeM(){$('#modal').classList.remove('on');render()}
function fld(f,v){const n=`name=${f.k}`;v=v??f.d??'';if(f.t=='select')return`<select ${n}>${f.o.map((o,i)=>`<option value="${f.v?i:o}" ${(f.v?i:o)==v?'selected':''}>${o}</option>`).join('')}</select>`;
if(f.t=='area')return`<textarea ${n} rows=2>${v}</textarea>`;if(f.t=='days')return DN.map((d,i)=>`<span class=dy><input type=checkbox ${n} value=${i} ${(v||[]).includes(i)?'checked':''}>${d}</span>`).join('');
return`<input ${n} type="${f.t||'text'}" ${f.t=='number'?'step=0.01 inputmode=decimal':''} value="${String(v).replace(/"/g,'&quot;')}">`}
function form(title,fs,v,cb){const m=$('#modal');m.innerHTML=`<div class=sheet><h3>${title}</h3>${fs.map(f=>`<label>${f.l}</label><br>`+fld(f,v[f.k])).join('')}<div class=row><button class=b2 onclick=closeM()>Cancelar</button><button class=b id=ok>Salvar</button></div></div>`;m.classList.add('on');
$('#ok').onclick=()=>{const o={};for(const f of fs){const q=m.querySelectorAll(`[name=${f.k}]`);o[f.k]=f.t=='days'?[...q].filter(x=>x.checked).map(x=>+x.value):f.t=='number'?parseFloat(String(q[0].value).replace(',','.')):f.v?+q[0].value:q[0].value.trim()}
const er=cb(o);if(er)return toast(er);save();closeM()}}
const del=(a,id)=>{if(confirm('Excluir este item?')){S[a]=S[a].filter(x=>x.id!=id);save();render()}};
/* ROTINA */
const tasksOn=d=>S.tasks.filter(t=>t.rec?t.days.includes(new Date(d+'T12:00').getDay()):t.date==d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const isD=(t,d)=>t.done.includes(d);
function tog(id,d){const t=S.tasks.find(x=>x.id==id);if(isD(t,d)){t.done=t.done.filter(x=>x!=d);S.xp=Math.max(0,S.xp-10)}else{t.done.push(d);S.xp+=10;toast('+10 XP')}
S.log[d]=tasksOn(d).filter(x=>isD(x,d)).length;save();render()}
function taskF(t){t=t||{};form(t.id?'Editar atividade':'Nova atividade',[{k:'title',l:'Título'},{k:'cat',l:'Categoria',t:'select',o:S.cats},{k:'date',l:'Data (se não recorrente)',t:'date',d:TD()},{k:'time',l:'Horário',t:'time'},{k:'dur',l:'Duração (min)',t:'number'},{k:'rec',l:'Recorrente?',t:'select',o:['Não','Sim'],v:1},{k:'days',l:'Dias da semana (recorrente)',t:'days'},{k:'prio',l:'Prioridade',t:'select',o:PR,v:1},{k:'desc',l:'Descrição',t:'area'}],{...t,rec:t.rec?1:0},o=>{
if(!o.title)return'Informe o título';o.rec=!!o.rec;if(o.rec&&!o.days.length)return'Escolha os dias da semana';if(!o.rec&&!o.date)return'Informe a data';if(t.id)Object.assign(t,o);else S.tasks.push({id:uid(),done:[],...o})})}
const taskRow=(t,d)=>`<div class="c row"><button class="ck ${isD(t,d)?'d':''}" onclick="tog('${t.id}','${d}')">${isD(t,d)?'✓':''}</button><div style="flex:1;${isD(t,d)?'opacity:.5;text-decoration:line-through':''}"><b>${t.title}</b> ${t.rec?'↻':''}<div class=mu>${t.time||'--:--'}${t.dur?' · '+t.dur+'min':''} · ${t.cat} · ${PR[t.prio]}</div>${t.desc?`<div class=mu>${t.desc}</div>`:''}</div><button class=s onclick="taskF(S.tasks.find(x=>x.id=='${t.id}'))">✎</button><button class=s onclick="del('tasks','${t.id}')">🗑</button></div>`;
function rotina(){let h=`<h1>Rotina</h1><div class=row style="margin:8px 0">${[['day','Dia'],['week','Semana'],['month','Mês']].map(m=>`<button class="s ${cm==m[0]?'on':''}" onclick="cm='${m[0]}';render()">${m[1]}</button>`).join('')}<input type=date value="${cd}" onchange="cd=this.value||TD();render()" style="margin:0"></div>`;
const dt=new Date(cd+'T12:00');
if(cm=='day'){const l=tasksOn(cd);h+=l.length?l.map(t=>taskRow(t,cd)).join(''):'<p class=mu>Nenhuma atividade neste dia. Toque em + para criar.</p>'}
if(cm=='week'){const s=new Date(dt);s.setDate(s.getDate()-s.getDay());for(let i=0;i<7;i++){const d=iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));h+=`<h2>${DN[i]} ${d.slice(8)}/${d.slice(5,7)}</h2>`+(tasksOn(d).map(t=>taskRow(t,d)).join('')||'<p class=mu>—</p>')}}
if(cm=='month'){const y=dt.getFullYear(),m=dt.getMonth(),n=new Date(y,m+1,0).getDate(),f=new Date(y,m,1).getDay();h+=`<h2>${dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><div class=cal>${DN.map(d=>`<span class=mu>${d}</span>`).join('')}${'<span></span>'.repeat(f)}`;
for(let i=1;i<=n;i++){const d=`${y}-${pad(m+1)}-${pad(i)}`,c=tasksOn(d).length;h+=`<button class="${d==TD()?'t':''}" onclick="cd='${d}';cm='day';render()">${i}<div class=mu>${c?c+'●':'&nbsp;'}</div></button>`}h+='</div>'}
return h}
/* OBJETIVOS */
const gp=g=>g.steps.length?Math.round(g.steps.filter(s=>s.d).length/g.steps.length*100):(g.manual||0);
function goalF(g){g=g||{};form(g.id?'Editar objetivo':'Novo objetivo',[{k:'title',l:'Título'},{k:'desc',l:'Descrição',t:'area'},{k:'cat',l:'Categoria',t:'select',o:GC},{k:'term',l:'Prazo',t:'select',o:TERM},{k:'dl',l:'Data limite',t:'date'},{k:'prio',l:'Prioridade',t:'select',o:PR,v:1},{k:'manual',l:'Progresso % (se não houver etapas)',t:'number'}],g,o=>{if(!o.title)return'Informe o título';o.manual=Math.min(100,Math.max(0,o.manual||0));if(g.id)Object.assign(g,o);else S.goals.push({id:uid(),steps:[],...o})})}
function stepF(id){form('Nova etapa',[{k:'t',l:'Etapa'}],{},o=>{if(!o.t)return'Informe a etapa';S.goals.find(g=>g.id==id).steps.push({id:uid(),t:o.t,d:false})})}
function stp(g,s){const G=S.goals.find(x=>x.id==g),st=G.steps.find(x=>x.id==s),b=gp(G);st.d=!st.d;if(b<100&&gp(G)==100){S.xp+=50;toast('Objetivo concluído! +50 XP')}save();render()}
function objetivos(){let h='<h1>Objetivos</h1><button class=b onclick="goalF()" style="width:100%;margin:8px 0">+ Novo objetivo</button>';
TERM.forEach((T,i)=>{const l=S.goals.filter(g=>g.term==T);if(!l.length)return;h+=`<h2>${T}</h2>`+l.map(g=>{const p=gp(g);return`<div class=c><div class="row sp"><b>${g.title}</b><span class=mu>${p==100?'Concluído ✓':p?'Em andamento':'Não iniciado'}</span></div><div class=mu>${g.cat} · ${PR[g.prio]}${g.dl?' · até '+g.dl.split('-').reverse().join('/'):''}</div>${g.desc?`<div class=mu>${g.desc}</div>`:''}<div class=pb><i style="width:${p}%"></i></div><div class=mu>${p}%</div>${g.steps.map(s=>`<div class=row style="margin:4px 0"><button class="ck ${s.d?'d':''}" onclick="stp('${g.id}','${s.id}')">${s.d?'✓':''}</button><span style="${s.d?'opacity:.5':''}">${s.t}</span></div>`).join('')}<div class=row style="margin-top:8px"><button class=s onclick="stepF('${g.id}')">+ Etapa</button><button class=s onclick="goalF(S.goals.find(x=>x.id=='${g.id}'))">✎</button><button class=s onclick="del('goals','${g.id}')">🗑</button></div></div>`}).join('')});
return h+(S.goals.length?'':'<p class=mu>Cadastre seus objetivos de curto, médio e longo prazo.</p>')}
/* FINANÇAS */
const sum=(t,f=x=>1)=>S.tx.filter(x=>x.type==t&&f(x)).reduce((a,x)=>a+x.val,0);
function txF(type,x){x=x||{};const ts={in:'Receita',out:'Despesa',sav:'Depósito'};if(type=='sav'&&!S.sav.length)return toast('Crie uma meta de economia primeiro');
const fs=type=='sav'?[{k:'sid',l:'Meta',t:'select',o:S.sav.map(s=>s.name)}]:[{k:'cat',l:type=='in'?'Origem':'Categoria',t:'select',o:type=='in'?IC:EC}];
form((x.id?'Editar ':'Novo ')+ts[type].toLowerCase(),[...fs,{k:'val',l:'Valor (R$)',t:'number'},{k:'date',l:'Data',t:'date',d:TD()},{k:'desc',l:'Descrição'}],{...x,sid:x.sid?S.sav.find(s=>s.id==x.sid)?.name:''},o=>{if(!(o.val>0))return'Informe um valor válido';if(!o.date)return'Informe a data';if(type=='sav')o.sid=S.sav.find(s=>s.name==o.sid).id;if(x.id)Object.assign(x,o);else{S.tx.push({id:uid(),type,...o});if(type=='sav')S.xp+=5}})}
function savF(){form('Meta de economia',[{k:'name',l:'Nome'},{k:'target',l:'Valor desejado (R$)',t:'number'}],{},o=>{if(!o.name||!(o.target>0))return'Preencha nome e valor';S.sav.push({id:uid(),...o})})}
const bar=(l,v,m,c='var(--ac)')=>`<div style="margin:6px 0"><div class="row sp mu"><span>${l}</span><span>${R(v)}</span></div><div class=pb><i style="width:${m?v/m*100:0}%;background:${c}"></i></div></div>`;
function monthly(){const n=new Date(),a=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1),f=x=>x.date.startsWith(k);a.push({l:d.toLocaleDateString('pt-BR',{month:'short'}),i:sum('in',f),o:sum('out',f)})}
const m=Math.max(1,...a.flatMap(x=>[x.i,x.o]));return`<div class=cols>${a.map(x=>`<div><span style="height:${x.i/m*90}px;background:var(--ok)"></span><span style="height:${x.o/m*90}px;background:var(--no)"></span><br>${x.l}</div>`).join('')}</div><div class=mu>Verde: receitas · Vermelho: despesas</div>`}
function fin(){const I=sum('in'),O=sum('out'),V=sum('sav'),cats={};S.tx.filter(x=>x.type=='out').forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.val);const mx=Math.max(1,...Object.values(cats));
return`<h1>Finanças</h1><div class=c><div class=mu>Saldo disponível</div><div class="big ${I-O-V<0?'no':''}">${R(I-O-V)}</div></div><div class=g><div class=c><div class=mu>Receitas</div><b class=ok>${R(I)}</b></div><div class=c><div class=mu>Despesas</div><b class=no>${R(O)}</b></div></div><div class=c><div class=mu>Total economizado</div><b>${R(V)}</b></div>
<div class=row><button class=b onclick="txF('in')">+ Receita</button><button class=b onclick="txF('out')">+ Despesa</button></div><div class=row style="margin-top:8px"><button class=b2 onclick="txF('sav')">+ Depósito</button><button class=b2 onclick="savF()">+ Meta</button></div>
<h2>Metas de economia</h2>${S.sav.map(s=>{const v=sum('sav',x=>x.sid==s.id);return`<div class=c>${bar(s.name,v,s.target,'var(--ok)')}<div class="row sp mu"><span>Faltam ${R(Math.max(0,s.target-v))} de ${R(s.target)}</span><button class=s onclick="if(confirm('Excluir meta e depósitos?')){S.tx=S.tx.filter(x=>x.sid!='${s.id}');del('sav','${s.id}')}">🗑</button></div></div>`}).join('')||'<p class=mu>Nenhuma meta criada.</p>'}
<h2>Gráfico mensal</h2><div class=c>${monthly()}</div><h2>Despesas por categoria</h2><div class=c>${Object.entries(cats).map(([k,v])=>bar(k,v,mx,'var(--no)')).join('')||'<span class=mu>Sem despesas.</span>'}</div>
<h2>Histórico</h2>${[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="c row sp"><div><b>${x.type=='sav'?'Depósito: '+(S.sav.find(s=>s.id==x.sid)?.name||''):x.cat}</b><div class=mu>${x.date.split('-').reverse().join('/')} ${x.desc||''}</div></div><div class=row><b class="${x.type=='in'?'ok':'no'}">${x.type=='in'?'+':'-'}${R(x.val)}</b><button class=s onclick="txF('${x.type}',S.tx.find(t=>t.id=='${x.id}'))">✎</button><button class=s onclick="del('tx','${x.id}')">🗑</button></div></div>`).join('')||'<p class=mu>Nenhum lançamento.</p>'}`}
/* MENTALIDADE */
const MSG={m:['Disciplina é fazer o que precisa ser feito, mesmo sem vontade.','Comece o dia com fé: Deus te deu esse dia para evoluir.','Foco no que importa hoje. Um passo de cada vez.','Responsabilidade: ninguém fará por você o que só você pode fazer.'],t:['Constância vence talento. Continue, mesmo devagar.','Superação é levantar mais uma vez depois da dificuldade.','Independência financeira começa em cada real bem decidido.','Sucesso é a soma de pequenos esforços repetidos todo dia.'],n:['Hoje você evoluiu, mesmo que pouco. Descanse com gratidão.','Confie em Deus: o que não deu hoje, amanhã você tenta de novo.','Disciplina também é saber recomeçar sem se punir.','Avalie o dia, aprenda e durma em paz.']};
const per=()=>{const h=new Date().getHours();return h<12?'m':h<18?'t':'n'},ALL=Object.values(MSG).flat(),dq=()=>MSG[per()][Math.floor(Date.now()/864e5)%4];
function mind(msg){msg=msg||dq();const f=S.fav.includes(msg),L=S.tasks.length?tasksOn(TD()):[],dn=L.filter(t=>isD(t,TD())).length;
return`<h1>Mentalidade</h1><div class=c style="font-size:17px">“${msg}”<div class=row style="margin-top:10px"><button class=b id=mb>PRECISO DE MOTIVAÇÃO</button><button class=b2 id=fv>${f?'★ Favorita':'☆ Favoritar'}</button></div></div>
<h2>Reflexão do fim do dia</h2><div class=c>Hoje você concluiu ${dn} de ${L.length} atividades. O que deu certo? O que posso melhorar amanhã? Pelo que sou grato?</div><h2>Favoritas</h2>${S.fav.map(m=>`<div class=c>${m}</div>`).join('')||'<p class=mu>Nenhuma ainda.</p>'}`}
function mindBind(){window.curMsg=window.curMsg||null;const m=$('#mb');if(!m)return;m.onclick=()=>{window.curMsg=ALL[Math.floor(Math.random()*ALL.length)];$('#app').innerHTML=back()+mind(window.curMsg);mindBind()};$('#fv').onclick=()=>{const q=window.curMsg||dq();S.fav=S.fav.includes(q)?S.fav.filter(x=>x!=q):[...S.fav,q];save();$('#app').innerHTML=back()+mind(q);mindBind()}}
/* GAMIFICAÇÃO / EVOLUÇÃO */
function streak(){let s=0,miss=0;for(let i=0;i<400;i++){const d=iso(new Date(Date.now()-i*864e5));if(S.log[d]>0){s++;miss=0}else if(i>0){if(++miss>=2)break}}return s}
const lastN=(n,o=0)=>{let c=0;for(let i=o;i<o+n;i++)c+=S.log[iso(new Date(Date.now()-i*864e5))]||0;return c};
function game(){const st=streak(),W=lastN(7),lv=Math.floor(S.xp/100)+1,md=[['Primeiro dia concluído',Object.values(S.log).some(v=>v>0)],['7 dias de disciplina',st>=7],['30 dias de consistência',st>=30],['Primeira meta alcançada',S.goals.some(g=>gp(g)==100)],['Primeiro objetivo financeiro concluído',S.sav.some(s=>sum('sav',x=>x.sid==s.id)>=s.target)]];
return`<h1>Modo Imparável</h1><div class=c><div class="row sp"><b class=big>Nível ${lv}</b><span class=mu>${S.xp} XP</span></div><div class=pb><i style="width:${S.xp%100}%"></i></div><div class=mu>${100-S.xp%100} XP para o próximo nível</div></div><div class=c>🔥 Sequência: <b>${st} dia(s)</b><div class=mu>Tolerância: 1 dia sem tarefas não zera sua sequência.</div></div>
<h2>Desafio semanal</h2><div class=c>Concluir 15 tarefas em 7 dias<div class=pb><i style="width:${Math.min(100,W/15*100)}%"></i></div><span class=mu>${W}/15</span></div><h2>Conquistas</h2>${md.map(m=>`<div class=c style="${m[1]?'':'opacity:.45'}">${m[1]?'🏅':'🔒'} ${m[0]}</div>`).join('')}`}
function evo(){const a=lastN(7),b=lastN(7,7),m=lastN(30),m2=lastN(30,30),I=sum('in'),O=sum('out'),cc=c=>S.tasks.filter(t=>t.cat==c).reduce((x,t)=>x+t.done.filter(d=>d>iso(new Date(Date.now()-30*864e5))).length,0),pl=S.tasks.reduce((x,t)=>x+(t.rec?t.days.length*4:1),0),gv=S.goals.length?Math.round(S.goals.reduce((x,g)=>x+gp(g),0)/S.goals.length):0;
return`<h1>Minha evolução</h1><div class=g><div class=c><div class=mu>Concluídas (7 dias)</div><b class=big>${a}</b><div class=mu>anterior: ${b}</div></div><div class=c><div class=mu>Concluídas (30 dias)</div><b class=big>${m}</b><div class=mu>anterior: ${m2}</div></div></div>
<div class=c>Taxa de produtividade (30 dias)<div class=pb><i style="width:${Math.min(100,pl?m/pl*100:0)}%"></i></div><span class=mu>${pl?Math.min(100,Math.round(m/pl*100)):0}% do planejado</span></div><div class=c>Estudos (30 dias): <b>${cc('Estudos')}</b> · Treinos: <b>${cc('Academia')+cc('Futebol')}</b> · Espiritualidade: <b>${cc('Espiritualidade')}</b></div>
<div class=c>Progresso médio dos objetivos<div class=pb><i style="width:${gv}%"></i></div><span class=mu>${gv}% · ${S.goals.filter(g=>gp(g)==100).length}/${S.goals.length} concluídos</span></div><div class=c>Resultado financeiro: <b class="${I-O<0?'no':'ok'}">${R(I-O)}</b><div class=mu>Economizado: ${R(sum('sav'))}</div></div><h2>Pontos a melhorar</h2><div class=c>${a<b?'Você concluiu menos tarefas que na semana anterior. Retome com uma tarefa pequena hoje.':'Bom ritmo! Mantenha a constância.'}</div>`}
/* LEMBRETES */
function remF(r){r=r||{};form(r.id?'Editar lembrete':'Novo lembrete',[{k:'label',l:'Lembrete (ex.: Beber água, Acordar, Treinar)'},{k:'time',l:'Horário',t:'time'},{k:'days',l:'Dias (vazio = só uma vez, hoje ou amanhã)',t:'days'}],r,o=>{if(!o.label||!o.time)return'Preencha nome e horário';if(r.id)Object.assign(r,o);else S.rem.push({id:uid(),on:true,once:TD(),...o})})}
const NP=()=>typeof Notification=='undefined'?'indisponível':Notification.permission;
function perm(){if(NP()=='indisponível')return toast('Este navegador não suporta notificações');Notification.requestPermission().then(()=>{render();toast('Permissão: '+NP())})}
function fire(t,k){if(fired[k])return;fired[k]=1;toast('🔔 '+t);try{if(NP()=='granted')new Notification('MY LIFE',{body:t})}catch(e){}}
setInterval(()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),d=TD();S.rem.filter(r=>r.on&&r.time==hm&&(r.days.length?r.days.includes(n.getDay()):true)).forEach(r=>fire(r.label,d+hm+r.id));tasksOn(d).filter(t=>t.time==hm&&!isD(t,d)).forEach(t=>fire(t.title,d+hm+t.id));const c=$('#clk');if(c)c.textContent=n.toLocaleTimeString('pt-BR')},1000);
function rem(){return`<h1>Lembretes</h1><div class=c>Notificações: <b>${NP()}</b><br><span class=mu>Os alertas tocam enquanto o app estiver aberto ou em segundo plano no navegador. Para alertas com o app totalmente fechado é preciso um servidor de push, que esta versão não tem.</span><button class=b style="width:100%;margin-top:8px" onclick="perm()">Ativar notificações</button></div><button class=b style="width:100%;margin-bottom:10px" onclick="remF()">+ Novo lembrete</button>
${S.rem.map(r=>`<div class="c row sp"><div><b>${r.label}</b><div class=mu>${r.time} · ${r.days.length?r.days.map(d=>DN[d]).join(', '):'uma vez'}</div></div><div class=row><button class="s ${r.on?'on':''}" onclick="S.rem.find(x=>x.id=='${r.id}').on=!${r.on};save();render()">${r.on?'ON':'OFF'}</button><button class=s onclick="remF(S.rem.find(x=>x.id=='${r.id}'))">✎</button><button class=s onclick="del('rem','${r.id}')">🗑</button></div></div>`).join('')||'<p class=mu>Nenhum lembrete.</p>'}`}
/* INÍCIO / PERFIL */
const back=()=>`<button class=s onclick="sub='';render()" style="margin-bottom:8px">← Voltar</button>`;
function home(){const h=new Date().getHours(),L=tasksOn(TD()),dn=L.filter(t=>isD(t,TD())),pend=L.filter(t=>!isD(t,TD())),nx=pend.find(t=>t.time>=new Date().toTimeString().slice(0,5)),I=sum('in'),O=sum('out'),V=sum('sav'),gl=S.goals.filter(g=>gp(g)<100).slice(0,3);
return`<div class="row sp"><div><h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}${S.name?', '+S.name:''}!</h1><div class=mu>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · <span id=clk></span></div></div>${S.photo?`<div class=av style="background-image:url(${S.photo})"></div>`:''}</div>
<div class=c style="margin-top:10px">“${dq()}”</div><div class=c>Progresso de hoje: ${dn.length}/${L.length}<div class=pb><i style="width:${L.length?dn.length/L.length*100:0}%"></i></div><div class=mu>🔥 ${streak()} dia(s) · Nível ${Math.floor(S.xp/100)+1}</div></div>
${nx?`<div class=c><span class=mu>Próximo compromisso</span><br><b>${nx.time} · ${nx.title}</b></div>`:''}<h2>Tarefas pendentes</h2>${pend.map(t=>taskRow(t,TD())).join('')||'<p class=mu>'+(L.length?'Tudo concluído hoje! 🎉':'Nada agendado hoje. Toque em + para adicionar.')+'</p>'}
<h2>Finanças</h2><div class=g><div class=c><div class=mu>Saldo</div><b>${R(I-O-V)}</b></div><div class=c><div class=mu>Economizado</div><b>${R(V)}</b></div></div><h2>Metas em andamento</h2>${gl.map(g=>`<div class=c>${g.title}<div class=pb><i style="width:${gp(g)}%"></i></div></div>`).join('')||'<p class=mu>Nenhuma meta ativa.</p>'}
<div class=row><button class=b2 onclick="sub='mind';render()">Mentalidade</button><button class=b2 onclick="sub='game';render()">Imparável</button><button class=b2 onclick="sub='evo';render()">Evolução</button></div>`}
function photo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;c.getContext('2d').drawImage(i,0,0,160,160);S.photo=c.toDataURL('image/jpeg',.7);save();render()};i.onerror=()=>toast('Imagem inválida');i.src=r.result};r.readAsDataURL(f)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mylife-backup-'+TD()+'.json';a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(structuredClone(D),JSON.parse(t));save();render();toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido')}})}
function perfil(){return`<h1>Perfil</h1><div class="c row"><div class=av style="${S.photo?`background-image:url(${S.photo})`:''}"></div><div style="flex:1"><label>Nome</label><input value="${S.name}" onchange="S.name=this.value.trim();save()"><input type=file accept="image/*" onchange="photo(event)"></div></div>
<div class=g><button class=b2 onclick="sub='evo';render()">📈 Evolução</button><button class=b2 onclick="sub='rem';render()">🔔 Lembretes</button><button class=b2 onclick="sub='game';render()">🏆 Imparável</button><button class=b2 onclick="sub='mind';render()">💬 Mentalidade</button></div>
<h2>Preferências</h2><div class=c><div class="row sp"><span>Tema</span><button class=s onclick="S.theme=S.theme=='dark'?'light':'dark';save();render()">${S.theme=='dark'?'Escuro':'Claro'}</button></div></div>
<div class=c><b>Categorias de rotina</b><div style="margin:8px 0">${S.cats.map(c=>`<button class=s onclick="if(confirm('Remover ${c}?')){S.cats=S.cats.filter(x=>x!='${c}');save();render()}">${c} ✕</button>`).join(' ')}</div><button class=s onclick="form('Nova categoria',[{k:'n',l:'Nome'}],{},o=>{if(!o.n)return'Informe o nome';if(!S.cats.includes(o.n))S.cats.push(o.n)})">+ Categoria</button></div>
<h2>Dados</h2><div class=row><button class=b onclick="exp()">Exportar backup</button><label class=b2 style="padding:10px 14px;text-align:center;border-radius:10px">Importar<input type=file accept=.json hidden onchange="imp(event)"></label></div><button class=b2 style="width:100%;margin-top:8px;color:var(--no)" onclick="if(confirm('Apagar TODOS os dados?')){S=structuredClone(D);save();render()}">Apagar todos os dados</button><p class=mu>Dados salvos neste aparelho (localStorage). Exporte backups com frequência.</p>`}
function quick(){tab=='fin'?txF('out'):tab=='obj'?goalF():taskF()}
function render(){document.documentElement.dataset.theme=S.theme;const T=[['home','Início','⌂'],['rot','Rotina','▦'],['obj','Objetivos','◎'],['fin','Finanças','$'],['per','Perfil','☺']];
$('#nav').innerHTML=T.map(t=>`<button class="${tab==t[0]&&!sub?'on':''}" onclick="tab='${t[0]}';sub='';render();scrollTo(0,0)"><b>${t[2]}</b>${t[1]}</button>`).join('');$('#fab').style.display=['home','rot','obj','fin'].includes(tab)&&!sub?'':'none';
let h;try{h=sub?back()+{mind:()=>mind(window.curMsg),game,evo,rem}[sub]():{home,rot:rotina,obj:objetivos,fin,per:perfil}[tab]()}catch(e){h='<div class=c>Erro ao exibir esta tela. Tente exportar um backup em Perfil.</div>';console.error(e)}
$('#app').innerHTML=h;if(sub=='mind')mindBind()}
render();
</script></body></html>
